rd": "output", "hook": "What comes out?", "question": "ChatGPT gives an answer after receiving your question. What is the answer in the system?", "answer": "Something produced by a system", "choices": ["A cause", "Something hidden before the system", "Something produced by a system", "A cost"], "deep": "Output is what comes out of a system after processing.", "arrow": "Process → Output", "challenge": "answer / system / output", "todai": "What output does the algorithm produce?", "example": "Output is a useful concept for academic thinking.", "explain": "Output is what comes out of a system after processing."}, {"concept": "Process", "word": "process", "hook": "What happens in between?", "question": "A vending machine takes money and gives a drink. What happens between input and output?", "answer": "The steps between input and output", "choices": ["The first cause only", "The steps between input and output", "The final answer only", "A personal view"], "deep": "Process is the set of steps that transforms input into output.", "arrow": "Input → Process → Output", "challenge": "money / machine / drink / process", "todai": "Which step in the process matters most?", "example": "Process is a useful concept for academic thinking.", "explain": "Process is the set of steps that transforms input into output."}, {"concept": "System", "word": "system", "hook": "How do the parts work together?", "question": "A school has students, teachers, classes, rules, and exams. What concept describes the whole?", "answer": "A set of connected parts", "choices": ["One isolated object", "A random event", "A private feeling", "A set of connected parts"], "deep": "A system is made of parts and relationships. The whole is more than one part.", "arrow": "Parts → System", "challenge": "school / parts / system", "todai": "What are the components of this system?", "example": "System is a useful concept for academic thinking.", "explain": "A system is made of parts and relationships."}, {"concept": " pt": "Benefit", "word": "benefit", "hook": "What good comes from it?", "question": "Exercise takes time, but it improves health. What is the improvement?", "answer": "A positive outcome or advantage", "choices": ["A positive outcome or advantage", "A hidden cost", "A device", "A problem"], "deep": "Benefit is the positive value gained from an action or choice.", "arrow": "Action → Benefit", "challenge": "exercise / health / benefit", "todai": "Who receives the benefit?", "example": "Benefit is a useful concept for academic thinking.", "explain": "Benefit is the positive value gained from an action or choice."}, {"concept": "Cost", "word": "cost", "hook": "What do you give up?", "question": "Studying for three hours improves skill but uses time. What concept describes what is spent?", "answer": "Something you give up or spend", "choices": ["A prediction", "Something you give up or spend", "A signal", "A final benefit"], "deep": "Cost is not only money. Time, energy, and attention can also be costs.", "arrow": "Choice → Cost", "challenge": "time / energy / cost", "todai": "What is the hidden cost?", "example": "Cost is a useful concept for academic thinking.", "explain": "Cost is not only money."}, {"concept": "Opportunity", "word": "opportunity", "hook": "What chance can be used?", "question": "A contest opens a chance to test your programming skill. What concept is this?", "answer": "A chance to gain value", "choices": ["A physical device", "A repeated error", "A certain loss", "A chance to gain value"], "deep": "Opportunity is a chance to do or gain something useful.", "arrow": "Situation → Opportunity", "challenge": "contest / skill / opportunity", "todai": "What opportunity does this situation create?", "example": "Opportunity is a useful concept for academic thinking.", "explain": "Opportunity is a chance to do or gain something useful."}, {"concept": "Problem", "word": "problem", "hook": "What needs to be solved?", "question": "A website loads too slowly. What s to reach a goal", "A final result"], "deep": "A plan connects a goal to concrete action. It can be updated with feedback.", "arrow": "Goal → Plan → Action", "challenge": "study time / plan", "todai": "Does the plan match the goal?", "example": "Plan is a useful concept for academic thinking.", "explain": "A plan connects a goal to concrete action."}, {"concept": "Resource", "word": "resource", "hook": "What can you use?", "question": "Time, money, people, and information can help solve a problem. What are they?", "answer": "Something available for use", "choices": ["Something available for use", "A final answer", "A pure opinion", "A repeated trend"], "deep": "A resource is something you can use. Scarce resources create constraints.", "arrow": "Resource → Action", "challenge": "time / money / people / resource", "todai": "Which resource is most limited?", "example": "Resource is a useful concept for academic thinking.", "explain": "A resource is something you can use."}, {"concept": "Signal", "word": "signal", "hook": "What is the important sign?", "question": "A warning light turns on before a machine fails. What concept is this?", "answer": "Meaningful information that stands out", "choices": ["A final decision", "A cost", "Useless noise", "Meaningful information that stands out"], "deep": "A signal is meaningful information. The challenge is to separate signal from noise.", "arrow": "Signal → Decision", "challenge": "warning light / signal", "todai": "What signal should we pay attention to?", "example": "Signal is a useful concept for academic thinking.", "explain": "A signal is meaningful information."}, {"concept": "Network", "word": "network", "hook": "How are things connected?", "question": "Friends on SNS, stations, and routers are all connected by links. What concept is this?", "answer": "A structure of connected nodes", "choices": ["A fixed cost", "A private feeling", "A single isolated object", "A structure of connected nodes"], "deep": "A network is ma concept": "Trade-off", "word": "trade-off", "hook": "What must be given up?", "question": "A faster app may use more battery. What concept describes this tension?", "answer": "A situation where gaining one thing means losing another", "choices": ["A repeated pattern only", "A claim", "A free benefit with no cost", "A situation where gaining one thing means losing another"], "deep": "A trade-off means you cannot maximize everything at once.", "arrow": "Gain ⚔ Loss", "challenge": "speed / battery / trade-off", "todai": "What is gained, and what is lost?", "example": "Trade-off is a useful concept for academic thinking.", "explain": "A trade-off means you cannot maximize everything at once."}, {"concept": "Optimization", "word": "optimization", "hook": "What is the best under limits?", "question": "You have limited time and want the highest score. What concept is this?", "answer": "Finding the best choice under constraints", "choices": ["Choosing randomly", "Ignoring limits", "Doing everything equally", "Finding the best choice under constraints"], "deep": "Optimization is finding the best option under constraints.", "arrow": "Constraint → Best Choice", "challenge": "time / score / optimization", "todai": "What are you maximizing?", "example": "Optimization is a useful concept for academic thinking.", "explain": "Optimization is finding the best option under constraints."}, {"concept": "Reliability", "word": "reliability", "hook": "Can it be trusted repeatedly?", "question": "A sensor gives the same result every time under the same condition. What concept is this?", "answer": "Consistent performance over time", "choices": ["Consistent performance over time", "A hidden opinion", "A single lucky result", "A beautiful design"], "deep": "Reliability is consistency. A reliable system works again and again.", "arrow": "Repeat → Reliability", "challenge": "sensor / same result / reliability", "todai": "Does it work every time?", "example": "Reliability is a useful concept for lity", "hook": "How good is it?", "question": "Two apps do the same thing, but one is easier and safer. What concept is being judged?", "answer": "How good something is", "choices": ["How old it is only", "A hidden assumption", "A raw input", "How good something is"], "deep": "Quality is about how well something meets needs or standards.", "arrow": "Standard → Quality", "challenge": "app / safe / easy / quality", "todai": "What standard is used?", "example": "Quality is a useful concept for academic thinking.", "explain": "Quality is about how well something meets needs or standards."}, {"concept": "Performance", "word": "performance", "hook": "How well does it work?", "question": "A computer runs a task quickly without crashing. What concept describes how well it works?", "answer": "How well a system performs a task", "choices": ["A personal preference only", "How well a system performs a task", "A hidden cause", "A random signal"], "deep": "Performance measures how well something works, often in speed, accuracy, or stability.", "arrow": "System → Performance", "challenge": "computer / speed / performance", "todai": "Which metric measures performance?", "example": "Performance is a useful concept for academic thinking.", "explain": "Performance measures how well something works, often in speed, accuracy, or stability."}, {"concept": "Learning", "word": "learning", "hook": "How does behavior improve?", "question": "A student uses mistakes to improve the next test. What concept is this?", "answer": "Improving through experience", "choices": ["A fixed device", "Forgetting everything", "Choosing randomly", "Improving through experience"], "deep": "Learning changes future behavior through experience and feedback.", "arrow": "Experience → Learning", "challenge": "mistakes / improvement / learning", "todai": "What changed after the experience?", "example": "Learning is a useful concept for academic thinking.", "explain": "Learning changes future behavior through experience and feedback."}, {"concept": "Agent", "word": "agent", "hook": "Who or what acts?", "question": "A robot chooses a path toward a goal. What concept describes the actor?", "answer": "Something that acts toward a goal", "choices": ["A raw number", "A passive object only", "Something that acts toward a goal", "A cost"], "deep": "An agent acts, chooses, or responds in an environment. In AI, agents use goals and feedback.", "arrow": "Agent → Action", "challenge": "robot / goal / agent", "todai": "What can the agent observe and do?", "example": "Agent is a useful concept for academic thinking.", "explain": "An agent acts, chooses, or responds in an environment."}, {"concept": "Prompt", "word": "prompt", "hook": "What instruction starts the response?", "question": "You type a request into ChatGPT to get an answer. What is that request?", "answer": "An instruction or input that guides a response", "choices": ["The final answer", "A random signal", "An instruction or input that guides a response", "A physical device"], "deep": "A prompt guides what an AI or person produces. Better prompts often produce better outputs.", "arrow": "Prompt → Response", "challenge": "ChatGPT / request / prompt", "todai": "What does the prompt ask for?", "example": "Prompt is a useful concept for academic thinking.", "explain": "A prompt guides what an AI or person produces."}, {"concept": "Automation", "word": "automation", "hook": "What happens without manual work?", "question": "A ticket gate opens automatically when a card is tapped. What concept is this?", "answer": "A process done by a machine or system", "choices": ["A personal opinion", "A purely manual task", "A process done by a machine or system", "A final risk"], "deep": "Automation replaces repeated human actions with systems. It can improve speed but may create new risks.", "arrow": "Task → Automation", "challenge": "ticket gate / card / automation", "todai": "What human task is being automated?", "example": "Automation is a useful concept for academic thinking.", "explain": "Automation replaces repeated human actions with systems."}, {"concept": "Simulation", "word": "simulation", "hook": "What can be tested before reality?", "question": "A disaster drill tests what might happen before a real earthquake. What concept is this?", "answer": "A model-based imitation of a real situation", "choices": ["A claim without testing", "A personal feeling", "A model-based imitation of a real situation", "Reality itself"], "deep": "Simulation lets us test possibilities before acting in the real world.", "arrow": "Model → Simulation", "challenge": "disaster drill / simulation", "todai": "What parts of reality are included?", "example": "Simulation is a useful concept for academic thinking.", "explain": "Simulation lets us test possibilities before acting in the real world."}, {"concept": "Decision", "word": "decision", "hook": "What choice is finally made?", "question": "After comparing options, a team chooses one plan. What concept is this?", "answer": "A final choice among options", "choices": ["A signal only", "A random pattern", "A device", "A final choice among options"], "deep": "Decision is the act of choosing. Good decisions use evidence, constraints, and goals.", "arrow": "Options → Decision", "challenge": "options / plan / decision", "todai": "What information supports the decision?", "example": "Decision is a useful concept for academic thinking.", "explain": "Decision is the act of choosing."}];const ENCOUNTERS=["School","Common Test","Target1900 / vocabulary book","Information Studies","Programming","AI / ChatGPT","News","Daily life","First time today"];let idx=Number(localStorage.getItem('todai50_idx')||0);let solved=JSON.parse(localStorage.getItem('todai50_solved')||'[]');let logs=JSON.parse(localStorage.getItem('todai50_logs')||'{}');let answered=false;function $(id){return document.getElementById(id)}function cur(){return Q[idx]}function toggle(id){$(id).classList.toggle('open')}function render(){const q=cur();answered=false;document.querySelectorAll('.layer').forEach(x=>x.classList.remove('open'));$('qid').textContent='Q'+String(idx+1).padStart(2,'0');$('concept').textContent=q.concept;$('hook').textContent=q.hook;$('question').textContent=q.question;$('result').classList.remove('show');$('result').innerHTML='';$('wordbox').classList.remove('show');$('extra').classList.remove('show');$('encounter').classList.remove('show');$('word').textContent=q.word;$('example').textContent=q.example;$('why').textContent=q.deep;$('connect').textContent='How TODAI students remember it: '+q.concept+' is not just a word. It is a reusable thinking tool.';$('arrow').textContent=q.arrow;$('challenge').textContent='Challenge ①: Use these keywords to create a one-sentence story: '+q.challenge;$('todai').textContent=q.todai;const choices=[...q.choices].sort(()=>Math.random()-.5);$('choices').innerHTML='';choices.forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=ch;b.onclick=()=>answer(ch,b);$('choices').appendChild(b)});renderChecks();$('progress').textContent=`${idx+1} / ${Q.length}  Cleared ${solved.length} / ${Q.length}`;localStorage.setItem('todai50_idx',idx)}function renderChecks(){const q=cur();const saved=(logs[q.concept]&&logs[q.concept].encounters)||[];$('checks').innerHTML='';ENCOUNTERS.forEach(name=>{const lab=document.createElement('label');lab.className='check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=saved.includes(name);cb.onchange=()=>saveEncounter();lab.appendChild(cb);lab.appendChild(document.createTextNode(name));$('checks').appendChild(lab)})}function saveEncounter(){const q=cur();const vals=[...document.querySelectorAll('#checks input')].map((cb,i)=>cb.checked?ENCOUNTERS[i]:null).filter(Boolean);if(!logs[q.concept])logs[q.concept]={};logs[q.concept].encounters=vals;logs[q.concept].lastSeen=new Date().toISOString();localStorage.setItem('todai50_logs',JSON.stringify(logs))}function answ let voices=[],englishVoices=[],audioReady=false;function isEnglishVoice(v){const s=(v.lang+' '+v.name).toLowerCase();return s.includes('en-')||s.includes('english')||s.includes('us')||s.includes('uk')}function loadVoices(){if(!('speechSynthesis'in window)){$('audioStatus').textContent='Audio is not supported in this browser.';return}voices=speechSynthesis.getVoices()||[];englishVoices=voices.filter(isEnglishVoice);const sel=$('voiceSelect');sel.innerHTML='';if(englishVoices.length===0){const o=document.createElement('option');o.value='';o.textContent='Default English voice';sel.appendChild(o);$('audioStatus').textContent='No English voice listed yet. Tap Enable Audio, then try Word.';return}englishVoices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' / '+v.lang;sel.appendChild(o)});sel.value=englishVoices[0].name;$('audioStatus').textContent=audioReady?'Audio ready.':'Tap Enable Audio first.'}function getVoice(){const sel=$('voiceSelect');return englishVoices.find(v=>sel&&v.name===sel.value)||englishVoices[0]||null}function unlockAudio(){if(!('speechSynthesis'in window)){alert('This browser does not support speech synthesis.');return}loadVoices();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Audio ready.');const v=getVoice();if(v){u.voice=v;u.lang=v.lang||'en-US'}else{u.lang='en-US'}u.rate=0.9;u.volume=1.0;u.onend=()=>{audioReady=true;$('audioStatus').textContent='Audio ready. Try Word or Example.'};u.onerror=()=>{audioReady=true;$('audioStatus').textContent='Audio attempted. If silent, check Android text-to-speech settings.'};speechSynthesis.speak(u);setTimeout(loadVoices,300);setTimeout(loadVoices,1000)}function speak(t){if(!('speechSynthesis'in window)){alert('This browser does not support speech synthesis.');return}if(!audioReady){$('audioStatus').textContent='Please tap "Tap to Enable Audio" first.';return}loadVoices();speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(String(t||''));const v=getVoice();if(v){u.voice=v;u.lang=v.lang||'en-US'}else{u.lang='en-US'}u.rate=Number($('rateSelect').value||0.86);u.pitch=1.0;u.volume=1.0;u.onerror=()=>{$('audioStatus').textContent='Speech failed. Check Android Settings > Text-to-speech output.'};speechSynthesis.speak(u)},80)}if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,200);setTimeout(loadVoices,800)}function speakWord(){speak(cur().word)}function speakExample(){speak(cur().example)}function speakConcept(){speak(cur().concept+'. '+cur().example)}render();
