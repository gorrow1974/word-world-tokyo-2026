0;color:#0f172a}.green{background:#16a34a;color:white}.blue{background:#2563eb;color:white}.purple{background:#7c3aed;color:white}.extra{display:none;margin-top:14px}.extra.show{display:block}.extraTitle{padding:12px;border-radius:16px;background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;font-weight:1000;text-align:center}.layer{border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;margin-top:10px;background:#f8fafc}.layer button{width:100%;border:0;background:#f8fafc;color:#111827;padding:13px 14px;text-align:left;font-size:15px;font-weight:1000;cursor:pointer}.content{display:none;padding:15px;background:white;border-top:1px solid #e5e7eb;color:#334155;line-height:1.75;font-size:15px}.open .content{display:block}.arrow{font-size:26px;font-weight:1000;text-align:center;color:#7c3aed;margin:10px 0}.encounter{display:none;margin-top:14px;padding:14px;border-radius:16px;background:#fafafa;border:1px solid #e5e7eb}.encounter.show{display:block}.encounter h3{margin:0 0 8px;font-size:16px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{padding:10px;border:1px solid #e5e7eb;border-radius:12px;background:white;font-weight:800}.footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(245,247,251,0),#f5f7fb 30%);padding:36px 14px 14px}.nav{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.nav button{border:0;border-radius:16px;min-height:54px;font-size:16px;font-weight:1000;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.progress{font-size:13px;color:#64748b;text-align:right;margin-bottom:8px}select{border-radius:10px;padding:7px;font-weight:800;max-width:190px}@media(max-width:560px){.actions,.checks{grid-template-columns:1fr}header{display:block}}
</style></head><body><div class="app"><header><div><h1>TODAI Forest Lv1: 50 Concepts</h1><div class="sub">English-only quiz with Concept Encounter Log.</div></div><div><select id="voiceSelect"></select><br><select id="rateSelect"><option value="0.72">Slow</option><option value="0.86" selected>Normal</option><option value="1.0">Fast</option></select></div></header><div class="progress" id="progress"></div><section class="card"><div><span class="badge" id="qid"></span><span class="badge" id="concept"></span></div><div class="hook" id="hook"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="result" id="result"></div><div class="wordbox" id="wordbox"><div class="wordline"><div class="word" id="word"></div></div><div class="example" id="example"></div><div class="actions"><button class="action green" onclick="speakWord()">▶ Word</button><button class="action blue" onclick="speakExample()">▶ Example</button><button class="action purple" onclick="speakConcept()">▶ Concept</button></div></div><div class="extra" id="extra"><div class="extraTitle">Extra Study for TODAI<br>One more step toward academic thinking</div><div class="layer" id="whyL"><button onclick="toggle('whyL')">❓ Why does this happen?</button><div class="content" id="why"></div></div><div class="layer" id="connectL"><button onclick="toggle('connectL')">🔗 How TODAI students remember it</button><div class="content"><div id="connect"></div><div class="arrow" id="arrow"></div></div></div><div class="layer" id="challengeL"><button onclick="toggle('challengeL')">✍️ Challenge ①: Build a one-sentence story</button><div class="content" id="challenge"></div></div><div class="layer" id="todaiL"><button onclick="toggle('todaiL')">🧠 How TODAI thinks</button><div class="content" id="todai"></div></div></div><div class="encounter" id="encounter"><h3>Where have you seen this concept?</h3><div class="checks" id="checks"></div></div></section></div><div class="footer"><div class="nav"><button class="secondary" onclick="prev()">← Prev</button><button class="primary" onclick="next()">Next →</button><button class="secondary" onclick="resetQ()">Retry</button></div></div><script>
const Q=[{"id": "Q001", "concept": "Cause", "word": "cause", "title": "Why did it happen?", "hook": "The rain made the road slippery. What concept explains why something happens?", "question": "Which explanation is closest to this concept?", "choices": ["A random event", "A final result", "A personal opinion", "Something that produces an effect"], "answer": "Something that produces an effect", "explain": "Cause is the reason something happens.", "deep": "Cause is the reason something happens. In academic reading, always separate the cause from the effect.", "arrow": "Cause → Effect", "challenge": "rain / slippery road / accident / cause", "todai": "If grades improve after extra study, what is the cause?", "example": "Cause is a useful concept for academic thinking."}, {"id": "Q002", "concept": "Effect", "word": "effect", "title": "What happened as a result?", "hook": "A phone battery runs out after hours of use. What concept describes what happens afterward?", "question": "Which explanation is closest to this concept?", "choices": ["The starting reason", "A hidden assumption", "A type of data", "The result of a cause"], "answer": "The result of a cause", "explain": "Effect is what happens because of a cause.", "deep": "Effect is what happens because of a cause. Do not confuse the trigger with the result.", "arrow": "Cause → Effect", "challenge": "practice / confidence / effect", "todai": "If a new rule changes behavior, what is the effect?", "example": "Effect is a useful concept for academic thinking."}, {"id": "Q003", "concept": "Reason", "word": "reason", "title": "What explains the choice?", "hook": "A student chooses to review mistakes before a test. What explains the choice?", "question": "Which explanation is closest to this concept?", "choices": ["The explanation for an action or idea", "A physical device", "A market price", "A repeated pattern"], "answer": "The explanation for an action or idea", "explain": "Reason gives the explanation behind a claim, action, or decision.", "deep": "Reason gives the explanation behind a claim, action, or decision.", "arrow": "Reason → Claim", "challenge": "decision / explanation / reason", "todai": "What reason supports the author's opinion?", "example": "Reason is a useful concept for academic thinking."}, {"id": "Q004", "concept": "Result", "word": "result", "title": "What came out in the end?", "hook": "After one month of practice, the test score rises. What concept describes the final outcome?", "question": "Which explanation is closest to this concept?", "choices": ["The outcome after a process", "The original plan", "A signal", "A possible risk"], "answer": "The outcome after a process", "explain": "Result is the outcome.", "deep": "Result is the outcome. In reading, identify what changed after the process.", "arrow": "Process → Result", "challenge": "practice / score / result", "todai": "What result did the experiment produce?", "example": "Result is a useful concept for academic thinking."}, {"id": "Q005", "concept": "Evidence", "word": "evidence", "title": "Is that really true?", "hook": "When someone says, This method works, what should you ask for?", "question": "Which explanation is closest to this concept?", "choices": ["A private feeling", "A popular trend", "A louder voice", "Information that supports a claim"], "answer": "Information that supports a claim", "explain": "Evidence supports a claim.", "deep": "Evidence supports a claim. In English, evidence is usually uncountable because it refers to support as a whole.", "arrow": "Claim ← Evidence", "challenge": "claim / data / support / evidence", "todai": "What evidence supports the author's claim?", "example": "Evidence is a useful concept for academic thinking."}, {"id": "Q006", "concept": "Data", "word": "data", "title": "What is being recorded?", "hook": "Your phone records steps, location, and screen time. What are these records called?", "question": "Which explanation is closest to this concept?", "choices": ["A physical tool", "Recorded facts or values", "A final conclusion", "A moral opinion"], "answer": "Recorded facts or values", "explain": "Data is raw recorded information.", "deep": "Data is raw recorded information. It becomes useful when organized and interpreted.", "arrow": "Data → Information", "challenge": "steps / phone / data", "todai": "What data would you collect to test the idea?", "example": "Data is a useful concept for academic thinking."}, {"id": "Q007", "concept": "Information", "word": "information", "title": "What does the data tell us?", "hook": "A list of temperatures becomes useful when it shows that summer is getting hotter. What is it becoming?", "question": "Which explanation is closest to this concept?", "choices": ["Meaningful data", "A device", "A cost", "Random noise"], "answer": "Meaningful data", "explain": "Information is data with meaning.", "deep": "Information is data with meaning. It helps people understand and decide.", "arrow": "Data → Information → Decision", "challenge": "temperature / meaning / information", "todai": "What information is needed to decide?", "example": "Information is a useful concept for academic thinking."}, {"id": "Q008", "concept": "Pattern", "word": "pattern", "title": "What repeats?", "hook": "The same type of mistake appears in every mock test. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["A device", "A single accident", "A repeated structure or behavior", "A personal belief"], "answer": "A repeated structure or behavior", "explain": "A pattern is something that repeats.", "deep": "A pattern is something that repeats. Finding patterns is the first step toward prediction.", "arrow": "Observation → Pattern → Prediction", "challenge": "mistakes / mock test / pattern", "todai": "What pattern can you find in the data?", "example": "Pattern is a useful concept for academic thinking."}, {"id": "Q009", "concept": "Trend", "word": "trend", "title": "What direction is it moving?", "hook": "The number of online lessons increases every year. What concept describes this movement?", "question": "Which explanation is closest to this concept?", "choices": ["A single example", "A hidden rule", "A proof", "A general direction of change"], "answer": "A general direction of change", "explain": "A trend is the direction of change over time.", "deep": "A trend is the direction of change over time. It is not just one event.", "arrow": "Time → Trend", "challenge": "online lessons / increase / trend", "todai": "Is the trend increasing or decreasing?", "example": "Trend is a useful concept for academic thinking."}, {"id": "Q010", "concept": "Prediction", "word": "prediction", "title": "What may happen next?", "hook": "Past weather data suggests tomorrow may be rainy. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["A past result", "A fixed rule", "An estimate about the future", "A moral claim"], "answer": "An estimate about the future", "explain": "Prediction uses patterns or models to estimate the future.", "deep": "Prediction uses patterns or models to estimate the future. It is useful but not perfect.", "arrow": "Data → Pattern → Prediction", "challenge": "weather / future / prediction", "todai": "What could make this prediction fail?", "example": "Prediction is a useful concept for academic thinking."}, {"id": "Q011", "concept": "Input", "word": "input", "title": "What goes in?", "hook": "You type a question into ChatGPT. What is the question in the system?", "question": "Which explanation is closest to this concept?", "choices": ["A risk", "Something produced by a system", "A final result", "Something given to a system"], "answer": "Something given to a system", "explain": "Input is what enters a system.", "deep": "Input is what enters a system. Without input, the system has nothing to process.", "arrow": "Input → Process", "challenge": "question / ChatGPT / input", "todai": "What is the input in this system?", "example": "Input is a useful concept for academic thinking."}, {"id": "Q012", "concept": "Output", "word": "output", "title": "What comes out?", "hook": "ChatGPT gives an answer after receiving your question. What is the answer in the system?", "question": "Which explanation is closest to this concept?", "choices": ["Something hidden before the system", "A cost", "Something produced by a system", "A cause"], "answer": "Something produced by a system", "explain": "Output is what comes out of a system after processing.", "deep": "Output is what comes out of a system after processing.", "arrow": "Process → Output", "challenge": "answer / system / output", "todai": "What output does the algorithm produce?", "example": "Output is a useful concept for academic thinking."}, {"id": "Q013", "concept": "Process", "word": "process", "title": "What happens in between?", "hook": "A vending machine takes money and gives a drink. What happens between input and output?", "question": "Which explanation is closest to this concept?", "choices": ["A personal view", "The final answer only", "The steps between input and output", "The first cause only"], "answer": "The steps between input and output", "explain": "Process is the set of steps that transforms input into output.", "deep": "Process is the set of steps that transforms input into output.", "arrow": "Input → Process → Output", "challenge": "money / machine / drink / process", "todai": "Which step in the process matters most?", "example": "Process is a useful concept for academic thinking."}, {"id": "Q014", "concept": "System", "word": "system", "title": "How do the parts work together?", "hook": "A school has students, teachers, classes, rules, and exams. What concept describes the whole?", "question": "Which explanation is closest to this concept?", "choices": ["One isolated object", "A private feeling", "A random event", "A set of connected parts"], "answer": "A set of connected parts", "explain": "A system is made of parts and relationships.", "deep": "A system is made of parts and relationships. The whole is more than one part.", "arrow": "Parts → System", "challenge": "school / parts / system", "todai": "What are the components of this system?", "example": "System is a useful concept for academic thinking."}, {"id": "Q015", "concept": "Feedback", "word": "feedback", "title": "How does the result change the next action?", "hook": "A mock test result makes a student change study habits. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["Ignoring results", "Stopping all action", "Choosing randomly", "Using results to improve the next action"], "answer": "Using results to improve the next action", "explain": "Feedback sends results back into the next action.", "deep": "Feedback sends results back into the next action. It is central to learning and improvement.", "arrow": "Output ↺ Input", "challenge": "mock test / study / feedback", "todai": "What should be changed after seeing the result?", "example": "Feedback is a useful concept for academic thinking."}, {"id": "Q016", "concept": "Choice", "word": "choice", "title": "Which option do you take?", "hook": "You can study math or English first. What concept describes selecting one?", "question": "Which explanation is closest to this concept?", "choices": ["A natural law", "A hidden signal", "Selecting among options", "A repeated pattern"], "answer": "Selecting among options", "explain": "Choice is selecting one option from several.", "deep": "Choice is selecting one option from several. Every choice involves giving up something else.", "arrow": "Options → Choice", "challenge": "math / English / choice", "todai": "What option is being chosen?", "example": "Choice is a useful concept for academic thinking."}, {"id": "Q017", "concept": "Risk", "word": "risk", "title": "What could go wrong?", "hook": "Crossing the road while looking at a phone. What concept describes the possible bad outcome?", "question": "Which explanation is closest to this concept?", "choices": ["The possibility of a negative outcome", "A guaranteed failure", "A benefit", "A proof"], "answer": "The possibility of a negative outcome", "explain": "Risk is not just danger.", "deep": "Risk is not just danger. It combines possibility and impact.", "arrow": "Probability × Impact → Risk", "challenge": "phone / road / risk", "todai": "How likely is it, and how serious is it?", "example": "Risk is a useful concept for academic thinking."}, {"id": "Q018", "concept": "Benefit", "word": "benefit", "title": "What good comes from it?", "hook": "Exercise takes time, but it improves health. What is the improvement?", "question": "Which explanation is closest to this concept?", "choices": ["A hidden cost", "A device", "A problem", "A positive outcome or advantage"], "answer": "A positive outcome or advantage", "explain": "Benefit is the positive value gained from an action or choice.", "deep": "Benefit is the positive value gained from an action or choice.", "arrow": "Action → Benefit", "challenge": "exercise / health / benefit", "todai": "Who receives the benefit?", "example": "Benefit is a useful concept for academic thinking."}, {"id": "Q019", "concept": "Cost", "word": "cost", "title": "What do you give up?", "hook": "Studying for three hours improves skill but uses time. What concept describes what is spent?", "question": "Which explanation is closest to this concept?", "choices": ["Something you give up or spend", "A signal", "A final benefit", "A prediction"], "answer": "Something you give up or spend", "explain": "Cost is not only money.", "deep": "Cost is not only money. Time, energy, and attention can also be costs.", "arrow": "Choice → Cost", "challenge": "time / energy / cost", "todai": "What is the hidden cost?", "example": "Cost is a useful concept for academic thinking."}, {"id": "Q020", "concept": "Opportunity", "word": "opportunity", "title": "What chance can be used?", "hook": "A contest opens a chance to test your programming skill. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["A certain loss", "A physical device", "A repeated error", "A chance to gain value"], "answer": "A chance to gain value", "explain": "Opportunity is a chance to do or gain something useful.", "deep": "Opportunity is a chance to do or gain something useful.", "arrow": "Situation → Opportunity", "challenge": "contest / skill / opportunity", "todai": "What opportunity does this situation create?", "example": "Opportunity is a useful concept for academic thinking."}, {"id": "Q021", "concept": "Problem", "word": "problem", "title": "What needs to be solved?", "hook": "A website loads too slowly. What concept describes the thing to fix?", "question": "Which explanation is closest to this concept?", "choices": ["A final answer", "A theory", "A situation that needs a solution", "A benefit"], "answer": "A situation that needs a solution", "explain": "A problem is a gap between the current state and the desired state.", "deep": "A problem is a gap between the current state and the desired state.", "arrow": "Problem → Solution", "challenge": "slow website / problem", "todai": "What exactly is the problem?", "example": "Problem is a useful concept for academic thinking."}, {"id": "Q022", "concept": "Solution", "word": "solution", "title": "How can it be fixed?", "hook": "A slow website becomes faster after image compression. What concept describes the fix?", "question": "Which explanation is closest to this concept?", "choices": ["A risk only", "A random pattern", "A way to solve a problem", "A hidden assumption"], "answer": "A way to solve a problem", "explain": "A solution addresses a problem.", "deep": "A solution addresses a problem. A good solution fits the real cause.", "arrow": "Problem → Solution", "challenge": "slow website / compression / solution", "todai": "Does the solution match the cause?", "example": "Solution is a useful concept for academic thinking."}, {"id": "Q023", "concept": "Goal", "word": "goal", "title": "What are you trying to reach?", "hook": "A student wants to score 80 percent on a test. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["A hidden cost", "A device", "A desired target or outcome", "A random result"], "answer": "A desired target or outcome", "explain": "A goal gives direction.", "deep": "A goal gives direction. Without a goal, it is hard to judge progress.", "arrow": "Goal → Plan", "challenge": "score / target / goal", "todai": "What is the goal, and how is it measured?", "example": "Goal is a useful concept for academic thinking."}, {"id": "Q024", "concept": "Plan", "word": "plan", "title": "How will you get there?", "hook": "A student divides study time across five days. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["A signal", "A final result", "A claim", "A set of actions to reach a goal"], "answer": "A set of actions to reach a goal", "explain": "A plan connects a goal to concrete action.", "deep": "A plan connects a goal to concrete action. It can be updated with feedback.", "arrow": "Goal → Plan → Action", "challenge": "study time / plan", "todai": "Does the plan match the goal?", "example": "Plan is a useful concept for academic thinking."}, {"id": "Q025", "concept": "Resource", "word": "resource", "title": "What can you use?", "hook": "Time, money, people, and information can help solve a problem. What are they?", "question": "Which explanation is closest to this concept?", "choices": ["A pure opinion", "Something available for use", "A final answer", "A repeated trend"], "answer": "Something available for use", "explain": "A resource is something you can use.", "deep": "A resource is something you can use. Scarce resources create constraints.", "arrow": "Resource → Action", "challenge": "time / money / people / resource", "todai": "Which resource is most limited?", "example": "Resource is a useful concept for academic thinking."}, {"id": "Q026", "concept": "Signal", "word": "signal", "title": "What is the important sign?", "hook": "A warning light turns on before a machine fails. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["Meaningful information that stands out", "A cost", "Useless noise", "A final decision"], "answer": "Meaningful information that stands out", "explain": "A signal is meaningful information.", "deep": "A signal is meaningful information. The challenge is to separate signal from noise.", "arrow": "Signal → Decision", "challenge": "warning light / signal", "todai": "What signal should we pay attention to?", "example": "Signal is a useful concept for academic thinking."}, {"id": "Q027", "concept": "Network", "word": "network", "title": "How are things connected?", "hook": "Friends on SNS, stations, and routers are all connected by links. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["A private feeling", "A structure of connected nodes", "A fixed cost", "A single isolated object"], "answer": "A structure of connected nodes", "explain": "A network is made of nodes and connections.", "deep": "A network is made of nodes and connections. The structure affects flow and influence.", "arrow": "Node ⇔ Node", "challenge": "SNS / stations / routers / network", "todai": "Which node is central?", "example": "Network is a useful concept for academic thinking."}, {"id": "Q028", "concept": "Device", "word": "device", "title": "What tool is used?", "hook": "A smartphone, sensor, or router performs a specific function. What concept is this?", "question": "Which explanation is closest to this concept?", "choices": ["A tool designed for a function", "A claim", "A trend", "A hidden assumption"], "answer": "A tool designed for a function", "explain": "A device is a tool with a function.", "d )||s.includes('english')||s.includes('us')||s.includes('uk')}function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices();englishVoices=voices.filter(isEnglishVoice);const sel=$('voiceSelect');sel.innerHTML='';englishVoices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' / '+v.lang;sel.appendChild(o)});if(englishVoices[0])sel.value=englishVoices[0].name}if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,200);setTimeout(loadVoices,800)}function getVoice(){const sel=$('voiceSelect');return englishVoices.find(v=>sel&&v.name===sel.value)||englishVoices[0]||null}function speak(t){if(!('speechSynthesis'in window))return;const v=getVoice();if(!v)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang||'en-US';u.rate=Number($('rateSelect').value||0.86);speechSynthesis.speak(u)}function speakWord(){speak(cur().word)}function speakExample(){speak(cur().example)}function speakConcept(){speak(cur().concept+'. '+cur().example)}render();
