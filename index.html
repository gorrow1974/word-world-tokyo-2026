<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word World Core 001-003</title><style>
*{box-sizing:border-box}:root{--bg:#f6faf4;--green:#174a2b;--navy:#07345b;--orange:#fb7c13;--line:#dce7da}body{margin:0;background:var(--bg);color:#102016;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1160px;margin:auto;padding:16px 14px 96px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.logo{font-size:30px;font-weight:1000;color:var(--green);line-height:1}.logo small{display:block;font-size:13px;color:#64748b;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:0;border-radius:999px;background:white;padding:9px 13px;font-weight:1000;box-shadow:0 8px 18px #0001}.tab.active{background:var(--orange);color:white}.hero{background:linear-gradient(135deg,#10466f,#062d50);color:white;border-radius:24px;padding:18px;margin:14px 0}.hero h1{margin:0;font-size:26px}.hero p{margin:8px 0 0;font-weight:800}.grid{display:grid;grid-template-columns:52% 48%;gap:14px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 28px #00000010}.badge{display:inline-block;border-radius:999px;background:#e9f7ec;color:#166534;padding:6px 10px;font-size:12px;font-weight:1000;margin:2px}.article{font-size:16px;line-height:1.65;white-space:pre-line}.golden{background:#fff8e7;border:2px solid #f2c878;border-radius:22px;padding:18px;text-align:center;font-size:25px;line-height:1.35;font-weight:1000;color:#92400e;margin-bottom:12px;white-space:pre-line}.sectionTitle{font-size:18px;font-weight:1000;margin:8px 0 10px;color:#0f3d25}.flow{background:#f8fff9;border:1px solid #cfe8d2;border-radius:20px;padding:16px;text-align:center;font-size:23px;font-weight:1000;line-height:1.35;white-space:pre-line}.questionType{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000;margin-top:12px}.question{font-size:21px;font-weight:1000;margin:10px 0}.choices{display:grid;gap:9px}.choice{border:2px solid #d8e7f7;background:#f8fbff;border-radius:16px;padding:12px;text-align:left;font-size:15px;font-weight:900;cursor:pointer}.choice.correct{background:#dcfce7;border-color:#22c55e;color:#166534}.choice.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.note{min-height:46px;background:#fff8e7;border:2px solid #f2c878;border-radius:16px;padding:12px;font-weight:900;margin-top:10px}.reflect{background:#fdf2f8;border:1px solid #fbcfe8;border-radius:18px;padding:14px;margin-top:12px;font-weight:900}.memory{background:#07345b;color:white;border-radius:22px;padding:16px;margin-top:14px;text-align:center}.memory .label{font-size:12px;color:#cfe8ff;font-weight:900}.memory .text{font-size:23px;font-weight:1000;white-space:pre-line;margin-top:6px}.footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding:28px 14px 12px}.nav{max-width:1160px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav button{border:0;border-radius:22px;padding:14px;font-size:16px;font-weight:1000}.secondary{background:#e5e7eb}.primary{background:var(--green);color:white}@media(max-width:850px){.grid{grid-template-columns:1fr}.golden{font-size:21px}.flow{font-size:19px}.article{font-size:15px}.hero h1{font-size:22px}}
</style></head><body><div class="app"><div class="top"><div class="logo">🌏 Word World<small>Core 001〜003 / TED風 × 共テ8割</small></div><div class="tabs" id="tabs"></div></div><section class="hero"><h1 id="title"></h1><p id="theme"></p></section><div class="grid"><section class="card"><div id="meta"></div><div class="sectionTitle">Reading</div><div class="article" id="article"></div></section><section class="card"><div class="golden" id="golden"></div><div class="sectionTitle">🦉 Flow Arrow</div><div class="flow" id="flow"></div><span class="questionType" id="questionType"></span><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="note" id="note">答えではなく、流れを見よう。</div><div class="reflect" id="reflection"></div><div class="memory"><div class="label">🧠 What remains?</div><div class="text" id="memory"></div></div></section></div></div><div class="footer"><div class="nav"><button class="secondary" id="prev">前へ</button><button class="primary" id="next">次へ</button></div></div><script>
let units=[],idx=0,logs=[];const E=x=>document.getElementById(x);fetch('units.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{units=d.units;logs=JSON.parse(localStorage.ww_core_logs||'[]');init();render();});function init(){units.forEach((u,i)=>{let b=document.createElement('button');b.className='tab';b.textContent='#'+u.id;b.onclick=()=>{idx=i;render()};E('tabs').appendChild(b)});E('prev').onclick=()=>{idx=(idx-1+units.length)%units.length;render()};E('next').onclick=()=>{idx=(idx+1)%units.length;render()};}function render(){const u=units[idx];[...document.querySelectorAll('.tab')].forEach((b,i)=>b.classList.toggle('active',i===idx));E('title').textContent=u.emoji+' '+u.id+' '+u.title;E('theme').textContent=u.theme;E('meta').innerHTML='<span class="badge">'+u.type+'</span><span class="badge">'+u.structure+'</span>';E('article').textContent=u.article;E('golden').textContent=u.golden;E('flow').textContent=u.arrow;E('questionType').textContent=u.qt;E('question').textContent=u.q;E('choices').innerHTML='';u.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(i,b);E('choices').appendChild(b)});E('note').textContent='答えではなく、流れを見よう。';E('reflection').textContent='Reflection: '+u.reflection;E('memory').textContent=u.golden;}function answer(i,btn){const u=units[idx];const ok=i===u.a;[...E('choices').children].forEach((b,n)=>{b.disabled=true;if(n===u.a)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');logs.push({unitId:u.id,questionType:u.qt,response:i,accuracy:ok,timestamp:new Date().toISOString()});localStorage.ww_core_logs=JSON.stringify(logs);E('note').textContent=ok?'OK。本文→Flow→Golden Sentence がつながっています。':'もう一歩。選択肢より先にFlowを確認しよう。';}
</script></body></html>
