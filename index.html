<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word World v17.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6faf4;color:#102016;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1080px;margin:auto;padding:18px 14px 92px}
.logo{font-size:30px;font-weight:1000;color:#174a2b}
.logo small{display:block;font-size:14px;color:#475569}
.hero{background:linear-gradient(135deg,#10466f,#062d50);color:white;border-radius:24px;padding:18px;margin:14px 0}
.hero h1{margin:0;font-size:24px}
.hero p{margin:8px 0 0;font-weight:800}
.levelbar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.level{border-radius:14px;background:#e5e7eb;padding:10px;text-align:center;font-weight:1000;color:#64748b}
.level.open{background:#dcfce7;color:#166534}
.level.active{background:#fb7c13;color:white}
.grid{display:grid;grid-template-columns:40% 1fr;gap:18px;align-items:stretch}
.card{background:white;border:1px solid #dce7da;border-radius:24px;padding:20px;box-shadow:0 12px 30px #0001}
.pill{display:inline-block;border-radius:999px;background:#e9f7ec;color:#166534;padding:7px 11px;font-weight:1000;font-size:12px;margin:3px}
.prompt{font-size:48px;font-weight:1000;text-align:center;color:#0f3d25;margin:42px 0 26px;line-height:1.12;letter-spacing:-.03em}
.prompt.deep{font-size:26px;text-align:left;margin:28px 0;letter-spacing:0}
.timer{background:#f8fafc;border:1px solid #dbe3df;border-radius:18px;padding:10px;margin-top:12px}
.timerTop{display:flex;justify-content:space-between;font-weight:1000}
.timerTop b{font-size:22px;color:#fb7c13}
.barOut{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}
.bar{height:100%;width:100%;background:#fb7c13}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{border:2px solid #d8e7f7;border-radius:20px;background:#f8fbff;padding:17px;font-size:19px;font-weight:1000;text-align:left;cursor:pointer}
.known{background:#dcfce7;border-color:#22c55e;color:#166534;text-align:center;font-size:24px}
.unknown{background:#fee2e2;border-color:#ef4444;color:#991b1b;text-align:center;font-size:24px}
.dontknow{background:#fff8e7;border-color:#f2c878;color:#92400e;text-align:center}
.correct{background:#dcfce7!important;border-color:#22c55e!important}
.wrong{background:#fee2e2!important;border-color:#ef4444!important}
.timeout{background:#fff7ed!important;border-color:#f97316!important;color:#9a3412!important}
.note{background:#fff8e7;border:2px solid #f2c878;border-radius:18px;padding:13px;font-weight:900;margin-top:14px;min-height:52px}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#07345b;color:white;border-radius:18px;padding:14px;margin-top:16px}
.big{font-size:28px;font-weight:1000}
.lbl{font-size:12px;color:#d5e9f7;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}
.box{background:white;border-radius:24px;max-width:520px;width:100%;padding:20px}
.reason{display:block;width:100%;border:2px solid #d8e7f7;background:#f8fbff;border-radius:16px;padding:14px;margin:8px 0;text-align:left;font-weight:1000}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#102016;color:white;border-radius:999px;padding:11px 18px;font-weight:1000;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#f6faf4 25%);padding:28px 14px 12px}
.nav{max-width:1080px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav button{border:0;border-radius:22px;padding:15px;font-weight:1000;font-size:16px}
.secondary{background:#e5e7eb}.primary{background:#174a2b;color:white}
@media(max-width:820px){
.grid{grid-template-columns:44% 56%;gap:10px}
.levelbar{grid-template-columns:repeat(3,1fr)}
.actions{grid-template-columns:1fr;gap:10px}
.prompt{font-size:30px;margin:28px 0 18px}
.prompt.deep{font-size:18px}
.card{padding:14px;border-radius:18px}
.btn{font-size:16px;padding:13px}
.known,.unknown{font-size:18px}
.dash{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:20px}
}
@media(max-width:430px){
.app{padding-left:8px;padding-right:8px}
.grid{grid-template-columns:43% 57%;gap:8px}
.prompt{font-size:26px}
.timerTop{font-size:12px}
.timerTop b{font-size:16px}
.btn{font-size:15px;padding:12px 10px}
.known,.unknown{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <div class="logo">🌏 Word World<small>v17.1 / Force 2 Column</small></div>
  <section class="hero">
    <h1>Lv01は軽快に。知ってる / 知らないだけ。</h1>
    <p>Lv02以降は「分からない」を使い、内容理解へ進みます。</p>
  </section>
  <div class="levelbar" id="levelbar"></div>
  <div class="grid">
    <section class="card">
      <div id="meta"></div>
      <div class="prompt" id="prompt">Loading...</div>
      <div class="timer"><div class="timerTop"><span>認識時間</span><span><b id="remain">15.0</b> 秒</span></div><div class="barOut"><div class="bar" id="bar"></div></div></div>
    </section>
    <section class="card">
      <div class="actions" id="choices"></div>
      <div class="note" id="note">見た瞬間に反応。</div>
    </section>
  </div>
  <div class="dash">
    <div><div class="big" id="curLv">Lv01</div><div class="lbl">現在</div></div>
    <div><div class="big" id="rate">0%</div><div class="lbl">現Lv通過率</div></div>
    <div><div class="big" id="done">0</div><div class="lbl">現Lv試行</div></div>
    <div><div class="big" id="open">Lv01</div><div class="lbl">解放済み</div></div>
  </div>
</div>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">理由</h2><p>2回目以降なので理由も記録します。</p><button class="reason" data-r="first_seen">初めて見る</button><button class="reason" data-r="forgotten">完全に忘れていた</button><button class="reason" data-r="misunderstood">勘違いしていた</button><button class="reason" data-r="no_memory">覚えた記憶がない</button><button class="reason" data-r="context_unknown">文脈だと分からない</button></div></div>
<div class="toast" id="toast">記録しました</div>
<div class="footer"><div class="nav"><button class="secondary" id="reset">ログリセット</button><button class="primary" id="next">次へ</button></div></div>
<script>
let DATA,items=[],logs=[],idxByLevel={},activeLevel=1,unlocked=1,timer=null,t0=0,limit=15,pending=null;
const E=x=>document.getElementById(x);
fetch('items.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;items=d.items;logs=JSON.parse(localStorage.ww17logs||'[]');unlocked=+localStorage.ww17unlocked||1;activeLevel=+localStorage.ww17active||1;bind();render();});
function bind(){E('next').onclick=next;E('reset').onclick=()=>{localStorage.removeItem('ww17logs');localStorage.removeItem('ww17unlocked');localStorage.removeItem('ww17active');logs=[];unlocked=1;activeLevel=1;idxByLevel={};render()};document.querySelectorAll('.reason').forEach(b=>b.onclick=()=>setReason(b.dataset.r,b.textContent))}
function levelItems(l){return items.filter(x=>x.level===l)}
function levelLogs(l){return logs.filter(x=>x.level===l)}
function stats(l){let ls=levelLogs(l).filter(x=>'pass' in x), ok=ls.filter(x=>x.pass).length;return {n:ls.length,ok,rate:ls.length?Math.round(ok/ls.length*100):0}}
function evaluateUnlock(){for(let l=1;l<=6;l++){let g=DATA.config.gates[String(l)],s=stats(l);if(s.n>=g.minAttempts && s.rate>=g.unlockRate && unlocked<l+1){unlocked=Math.min(6,l+1)}}localStorage.ww17unlocked=unlocked}
function currentItem(){let arr=levelItems(activeLevel);let used=idxByLevel[activeLevel]||0;return arr[used%arr.length]}
function renderBar(){let h='';for(let l=1;l<=6;l++){let cls='level '+(l<=unlocked?'open ':'')+(l===activeLevel?'active':'');h+=`<div class="${cls}">Lv0${l}</div>`}E('levelbar').innerHTML=h}
function render(){evaluateUnlock();if(activeLevel>unlocked)activeLevel=unlocked;localStorage.ww17active=activeLevel;renderBar();let it=currentItem();E('meta').innerHTML=`<span class="pill">${it.id}</span><span class="pill">Lv0${it.level}</span>`;E('prompt').textContent=it.prompt;E('prompt').classList.toggle('deep',it.type!=='known');E('note').textContent=it.type==='known'?'見た瞬間に反応。':'選択肢から選ぶ。分からない場合は「分からない」。';drawChoices(it);dash();start()}
function drawChoices(it){let box=E('choices');box.innerHTML='';if(it.type==='known'){[['known','知ってる'],['unknown','知らない']].forEach(([c,t])=>{let b=document.createElement('button');b.className='btn '+c;b.textContent=t;b.onclick=()=>answerKnown(c);box.appendChild(b)})}else{it.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=c;b.onclick=()=>answerChoice(i,b);box.appendChild(b)});let dk=document.createElement('button');dk.className='btn dontknow';dk.textContent='分からない';dk.onclick=()=>answerDontKnow();box.appendChild(dk)}}
function start(){if(timer)clearInterval(timer);t0=Date.now();timer=setInterval(()=>{let s=(Date.now()-t0)/1000,r=Math.max(0,limit-s),p=Math.max(0,r/limit*100);E('remain').textContent=r.toFixed(1);E('bar').style.width=p+'%';E('bar').style.background=p>50?'#fb7c13':p>20?'#facc15':'#ef4444';if(r<=0)clearInterval(timer)},100)}
function sec(){let s=(Date.now()-t0)/1000;if(timer)clearInterval(timer);return +s.toFixed(2)}
function attemptNo(it){return logs.filter(x=>x.itemId===it.id).length+1}
function answerKnown(resp){let it=currentItem(),t=sec(),n=attemptNo(it);let rec={itemId:it.id,level:it.level,prompt:it.prompt,attemptNumber:n,response:resp,responseTimeSec:t,timestamp:new Date().toISOString()};if(resp==='unknown'){rec.unknownFlag=true;rec.unknownType=n===1?'baseline':'needs_reason';rec.pass=false}else{rec.pass=t<=limit}logs.push(rec);pending=logs.length-1;save();if(resp==='unknown'&&n>1){E('modalTitle').textContent='知らない理由';E('modal').classList.add('show');E('note').textContent='理由を選んでください。'}else{E('note').textContent=resp==='unknown'?'未学習として記録。ここから覚える。':(t<=limit?'記録しました。':'もう一歩。タイムリミット以内に瞬間的に反応する。'); if(activeLevel===1) setTimeout(next,360)}dash();showToast()}
function answerDontKnow(){let it=currentItem(),t=sec(),n=attemptNo(it);let rec={itemId:it.id,level:it.level,prompt:it.prompt,attemptNumber:n,response:'dont_know',unknownFlag:true,unknownType:n===1?'baseline':'needs_reason',pass:false,responseTimeSec:t,timestamp:new Date().toISOString()};logs.push(rec);pending=logs.length-1;save();if(n>1){E('modalTitle').textContent='分からない理由';E('modal').classList.add('show');E('note').textContent='理由を選んでください。'}else{E('note').textContent='未理解として記録しました。'}dash()}
function answerChoice(i,b){let it=currentItem(),t=sec(),ok=i===it.answer,pass=ok&&t<=limit;[...E('choices').children].forEach((x,n)=>{x.disabled=true;if(n===it.answer)x.classList.add('correct')});if(!ok)b.classList.add('wrong');if(ok&&t>limit)b.classList.add('timeout');logs.push({itemId:it.id,level:it.level,prompt:it.prompt,attemptNumber:attemptNo(it),response:i,accuracy:ok,pass,responseTimeSec:t,timestamp:new Date().toISOString()});save();E('note').textContent=pass?'OK。次へ進みましょう。':(t>limit?'もう一歩。タイムリミット以内に瞬間的に反応する。':'もう一歩。');dash()}
function setReason(code,label){if(pending!=null){logs[pending].unknownType=code;logs[pending].unknownReasonLabel=label;save()}E('modal').classList.remove('show');E('note').textContent='「'+label+'」として記録しました。';dash()}
function next(){idxByLevel[activeLevel]=(idxByLevel[activeLevel]||0)+1;evaluateUnlock();let s=stats(activeLevel),g=DATA.config.gates[String(activeLevel)];if(unlocked>activeLevel && s.n>=g.minAttempts && s.rate>=g.unlockRate){activeLevel++}render()}
function save(){localStorage.ww17logs=JSON.stringify(logs);localStorage.ww17unlocked=unlocked;localStorage.ww17active=activeLevel}
function dash(){let s=stats(activeLevel);E('curLv').textContent='Lv0'+activeLevel;E('rate').textContent=s.rate+'%';E('done').textContent=s.n;E('open').textContent='Lv0'+unlocked}
function showToast(){let t=E('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),650)}
</script>
</body></html>
