<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word World TED UI v1.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6faf4;color:#122017;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:940px;margin:auto;padding:16px 14px 90px}.logo{font-size:28px;font-weight:1000;color:#174a2b}.logo small{display:block;font-size:14px;color:#334155}.source{background:linear-gradient(#10466f,#062d50);color:white;border-radius:18px;padding:16px;margin:12px 0}.source h1{margin:0;font-size:24px}.route{background:#fff8e7;border:2px solid #f2c878;border-radius:16px;padding:12px;margin:12px 0;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.tab{border:0;border-radius:14px;padding:11px 4px;background:#e8eef4;font-weight:1000}.active{background:#fb7c13!important;color:white}.main{display:grid;grid-template-columns:38% 1fr;gap:16px}.card{background:white;border:1px solid #dce7da;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 26px #0001}.badge{display:inline-block;border-radius:999px;background:#eaf6ea;color:#166534;padding:7px 11px;font-weight:1000;font-size:12px;margin:3px}.prompt{font-size:25px;font-weight:1000;line-height:1.25;color:#0f3d25;white-space:pre-line}.prompt.lv1{font-size:44px;text-align:center;margin:28px 0 20px}.question{font-size:22px;font-weight:1000;margin:10px 0}.question.hiddenTitle{display:none}.timer{background:#f8fafc;border:1px solid #dbe3df;border-radius:14px;padding:10px;margin-top:12px}.timer.lv1{max-width:360px;margin:0 auto 18px;padding:8px 10px}.timerTop{display:flex;justify-content:space-between;align-items:center;font-weight:1000}.timerTop b{font-size:22px;color:#fb7c13}.timer.lv1 .timerTop b{font-size:18px}.barOut{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.bar{height:100%;width:100%;background:#fb7c13}.choices{display:grid;gap:10px}.choices.lv1{grid-template-columns:1fr 1fr;gap:14px}.choice{border:2px solid #d8e7f7;border-radius:16px;background:#f8fbff;padding:14px;text-align:left;font-size:17px;font-weight:1000}.choices.lv1 .choice{text-align:center;font-size:22px;padding:22px}.choice.known{background:#dcfce7;border-color:#22c55e;color:#166534}.choice.unknown{background:#fee2e2;border-color:#ef4444;color:#991b1b}.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534}.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b}.timeout{background:#fff7ed!important;border-color:#f97316!important;color:#9a3412!important}.arrow{text-align:center;background:#f8fff9;border:1px solid #cfe8d2;border-radius:16px;padding:14px;font-size:20px;font-weight:1000;margin-top:10px}.note{background:#fff8e7;border:2px solid #f2c878;border-radius:16px;padding:12px;font-weight:900;margin-top:10px}.unknownReasons{display:none;grid-template-columns:1fr;gap:8px;margin-top:10px}.unknownReasons.show{display:grid}.reasonBtn{border:2px solid #f2c878;border-radius:14px;background:#fff8e7;padding:11px;text-align:left;font-weight:1000}.result{display:none}.show{display:block}.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#07345b;color:white;border-radius:16px;padding:12px;margin-top:12px}.big{font-size:25px;font-weight:1000}.lbl{font-size:12px;color:#d5e9f7;font-weight:900}.footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#f6faf4 25%);padding:28px 14px 12px}.nav{max-width:940px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.nav button{border:0;border-radius:20px;padding:14px;font-weight:1000;font-size:16px}.primary{background:#174a2b;color:white}.secondary{background:#e5e7eb}@media(max-width:720px){.main{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}.dash{grid-template-columns:repeat(2,1fr)}.prompt.lv1{font-size:36px}.choices.lv1{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="logo">🌏 Word World<small>TED Lv01〜Lv06 UI Sample v1.3</small></div>
<section class="source"><h1 id="title"></h1><p>テーマ：AIは世界を良くするのか、危険なのか。単語から概念、構造、意図へ。</p></section>
<div class="route">実運用ではレベルごとの動線に分かれます。この画面はLv01〜Lv06のUI確認用サンプルです。</div>
<div class="tabs" id="tabs"></div>
<div class="main">
<section class="card"><div id="levelBadge"></div><div class="prompt" id="prompt"></div><div class="timer" id="timerBox"><div class="timerTop"><span>認識時間</span><span><b id="remain">15.0</b> 秒</span></div><div class="barOut"><div class="bar" id="bar"></div></div></div></section>
<section class="card"><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="unknownReasons" id="unknownReasons"><button class="reasonBtn" data-reason="first_seen">見たことない</button><button class="reasonBtn" data-reason="forgotten">忘れた</button><button class="reasonBtn" data-reason="misunderstood">勘違いした</button><button class="reasonBtn" data-reason="no_memory">覚えた記憶がない</button><button class="reasonBtn" data-reason="context_unknown">文だと分からない</button></div><div class="result" id="result"><div class="arrow" id="arrow"></div><div class="note" id="note"></div></div></section>
</div>
<div class="dash"><div><div class="big" id="attempts">0</div><div class="lbl">試行回数</div></div><div><div class="big" id="rate">0%</div><div class="lbl">正答率</div></div><div><div class="big" id="best">-</div><div class="lbl">最速</div></div><div><div class="big" id="avg">-</div><div class="lbl">平均</div></div></div></div>
<div class="footer"><div class="nav"><button class="secondary" id="known">知ってる</button><button class="secondary" id="unknown">知らない</button><button class="primary" id="next">次へ</button></div></div>
<script>
let DATA,lv=0,logs=[],timer=null,t0=0,limit=15,lastUnknownAttempt=null;const E=x=>document.getElementById(x);
fetch('ted_lv_sample.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;logs=JSON.parse(localStorage.ww_ted_logs_v13||'[]');init();render();dash()});
function init(){E('title').textContent=DATA.title;DATA.levels.forEach((x,i)=>{let b=document.createElement('button');b.className='tab';b.textContent=x.level;b.onclick=()=>{lv=i;render()};E('tabs').appendChild(b)});E('next').onclick=()=>{lv=(lv+1)%DATA.levels.length;render()};E('known').onclick=()=>quickKnown();E('unknown').onclick=()=>quickUnknown();document.querySelectorAll('.reasonBtn').forEach(b=>b.onclick=()=>setUnknownReason(b.dataset.reason,b.textContent))}
function itemKey(){let x=DATA.levels[lv];return x.level+'::'+x.prompt}
function attemptCountForCurrent(){let k=itemKey();return logs.filter(x=>x.itemKey===k).length}
function render(){let x=DATA.levels[lv],isLv1=x.level==='Lv01';[...document.querySelectorAll('.tab')].forEach((b,i)=>b.classList.toggle('active',i===lv));E('levelBadge').innerHTML='<span class="badge">'+x.level+'</span><span class="badge">'+x.name+'</span><span class="badge">制限 '+x.targetSec+'秒</span>';E('prompt').textContent=x.prompt;E('prompt').classList.toggle('lv1',isLv1);E('timerBox').classList.toggle('lv1',isLv1);E('question').textContent=x.question;E('question').classList.toggle('hiddenTitle',isLv1);E('choices').innerHTML='';E('choices').classList.toggle('lv1',isLv1);E('unknownReasons').classList.remove('show');x.choices.forEach(c=>{let b=document.createElement('button');b.className='choice';if(isLv1&&c==='知ってる')b.classList.add('known');if(isLv1&&c==='知らない')b.classList.add('unknown');b.textContent=c;b.onclick=()=>choose(c,b);E('choices').appendChild(b)});E('result').classList.remove('show');start()}
function start(){if(timer)clearInterval(timer);t0=Date.now();limit=DATA.levels[lv].targetSec||15;timer=setInterval(()=>{let s=(Date.now()-t0)/1000,r=Math.max(0,limit-s),p=Math.max(0,r/limit*100);E('remain').textContent=r.toFixed(1);E('bar').style.width=p+'%';E('bar').style.background=p>50?'#fb7c13':p>20?'#facc15':'#ef4444';if(r<=0)clearInterval(timer)},100)}
function finish(){let s=(Date.now()-t0)/1000;if(timer)clearInterval(timer);return +s.toFixed(2)}
function quickKnown(){choose('知ってる', [...E('choices').children].find(b=>b.textContent==='知ってる') || E('known'))}
function quickUnknown(){choose('知らない', [...E('choices').children].find(b=>b.textContent==='知らない') || E('unknown'))}
function choose(c,btn){let x=DATA.levels[lv],sec=finish(),n=attemptCountForCurrent()+1,isUnknown=c==='知らない',ok=c===x.answer,timeout=sec>x.targetSec;if(btn&&btn.classList){btn.classList.add(isUnknown?'wrong':'correct')}[...E('choices').children].forEach(b=>b.disabled=true);if(isUnknown){let rec={itemKey:itemKey(),attemptNumber:n,level:x.level,response:'unknown',unknownFlag:true,unknownType:n===1?'baseline':'needs_reason',responseTimeSec:sec,timestamp:new Date().toISOString(),prompt:x.prompt};logs.push(rec);lastUnknownAttempt=logs.length-1;E('arrow').textContent='未学習として記録しました。';if(n===1){E('note').textContent='ここから覚えていきましょう。'}else{E('note').textContent='理由を選んでください。';E('unknownReasons').classList.add('show')}E('result').classList.add('show');save();dash();return}
[...E('choices').children].forEach(b=>{if(b.textContent===x.answer)b.classList.add('correct')});if(timeout){btn.classList.add('timeout')}else if(!ok){btn.classList.add('wrong')}else{btn.classList.add('correct')}let finalOk=ok&&!timeout;logs.push({itemKey:itemKey(),attemptNumber:n,level:x.level,response:c,accuracy:finalOk,rawAccuracy:ok,timeout:timeout,responseTimeSec:sec,timestamp:new Date().toISOString(),prompt:x.prompt});E('arrow').textContent=x.arrow;E('note').textContent=timeout?'もう一歩。 タイムリミット以内に瞬間的に反応する。':(ok?'OK。 '+x.note:'もう一歩。 '+x.note);E('result').classList.add('show');save();dash()}
function setUnknownReason(code,label){if(lastUnknownAttempt!==null){logs[lastUnknownAttempt].unknownType=code;logs[lastUnknownAttempt].unknownReasonLabel=label;save()}E('unknownReasons').classList.remove('show');E('note').textContent='「'+label+'」として記録しました。';dash()}
function save(){localStorage.ww_ted_logs_v13=JSON.stringify(logs)}
function dash(){let judged=logs.filter(x=>'accuracy'in x),acc=judged.filter(x=>x.accuracy===true).length,ts=logs.map(x=>x.responseTimeSec).filter(x=>typeof x==='number');E('attempts').textContent=logs.length;E('rate').textContent=judged.length?Math.round(acc/judged.length*100)+'%':'0%';E('best').textContent=ts.length?Math.min(...ts).toFixed(2)+'秒':'-';E('avg').textContent=ts.length?(ts.reduce((a,b)=>a+b,0)/ts.length).toFixed(2)+'秒':'-'}
</script></body></html>
