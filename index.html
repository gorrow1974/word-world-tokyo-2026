<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word World v18</title>
<style>
*{box-sizing:border-box}
:root{--green:#174a2b;--navy:#07345b;--orange:#fb7c13;--bg:#f6faf4}
body{margin:0;background:var(--bg);color:#102016;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1080px;margin:auto;padding:14px 12px 88px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:28px;font-weight:1000;color:var(--green);line-height:1}
.logo small{display:block;font-size:13px;color:#475569;margin-top:4px}
.iconBtn{border:0;background:white;border-radius:16px;width:46px;height:46px;font-size:22px;box-shadow:0 8px 20px #0001}
.home{background:linear-gradient(135deg,#10466f,#062d50);color:white;border-radius:22px;padding:14px 16px;margin:12px 0}
.home h1{margin:0;font-size:22px}.home p{margin:6px 0 0;font-weight:800;font-size:14px}
.levelbar{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0 12px}
.level{border-radius:12px;background:#e5e7eb;padding:9px 4px;text-align:center;font-weight:1000;color:#64748b;font-size:13px}
.level.open{background:#dcfce7;color:#166534}.level.active{background:var(--orange);color:white}
.grid{display:grid;grid-template-columns:42% 58%;gap:12px;align-items:stretch}
.card{background:white;border:1px solid #dce7da;border-radius:22px;padding:16px;box-shadow:0 10px 28px #00000010}
.meta{min-height:28px}
.pill{display:inline-block;border-radius:999px;background:#e9f7ec;color:#166534;padding:6px 10px;font-weight:1000;font-size:12px;margin:2px}
.prompt{font-size:46px;font-weight:1000;text-align:center;color:#0f3d25;margin:34px 0 24px;line-height:1.08;letter-spacing:-.035em}
.prompt.deep{font-size:25px;text-align:left;margin:26px 0;letter-spacing:0;line-height:1.28}
.timer{background:#f8fafc;border:1px solid #dbe3df;border-radius:16px;padding:9px;margin-top:10px}
.timerTop{display:flex;justify-content:space-between;align-items:center;font-weight:1000;font-size:13px}
.timerTop b{font-size:20px;color:var(--orange)}
.barOut{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:7px}
.bar{height:100%;width:100%;background:var(--orange)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100%;align-content:center}
.actions.deep{grid-template-columns:1fr;align-content:start}
.btn{border:2px solid #d8e7f7;border-radius:18px;background:#f8fbff;padding:15px;font-size:17px;font-weight:1000;text-align:left;cursor:pointer}
.known,.unknown{text-align:center;font-size:23px;padding:28px 12px}
.known{background:#dcfce7;border-color:#22c55e;color:#166534}
.unknown{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.dontknow{background:#fff8e7;border-color:#f2c878;color:#92400e;text-align:center}
.correct{background:#dcfce7!important;border-color:#22c55e!important}
.wrong{background:#fee2e2!important;border-color:#ef4444!important}
.timeout{background:#fff7ed!important;border-color:#f97316!important;color:#9a3412!important}
.note{background:#fff8e7;border:2px solid #f2c878;border-radius:16px;padding:11px;font-weight:900;margin-top:12px;min-height:46px;font-size:14px}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--navy);color:white;border-radius:17px;padding:12px;margin-top:12px}
.big{font-size:24px;font-weight:1000}.lbl{font-size:11px;color:#d5e9f7;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}.box{background:white;border-radius:24px;max-width:520px;width:100%;padding:18px}.box h2{margin:0 0 8px}
.reason{display:block;width:100%;border:2px solid #d8e7f7;background:#f8fbff;border-radius:15px;padding:13px;margin:8px 0;text-align:left;font-weight:1000}
.settingsList button{display:block;width:100%;border:0;background:#f1f5f9;border-radius:14px;padding:13px;margin:8px 0;text-align:left;font-weight:1000}
pre{white-space:pre-wrap;max-height:280px;overflow:auto;background:#0f172a;color:#dbeafe;border-radius:14px;padding:12px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#102016;color:white;border-radius:999px;padding:10px 16px;font-weight:1000;opacity:0;transition:.18s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 25%);padding:26px 12px 10px}
.nav{max-width:1080px;margin:auto;display:grid;grid-template-columns:1fr;gap:10px}
.nav button{border:0;border-radius:20px;padding:13px;font-weight:1000;font-size:15px}
.primary{background:var(--green);color:white}
.hide{display:none!important}
@media(max-width:820px){
.app{padding-left:8px;padding-right:8px}
.grid{grid-template-columns:43% 57%;gap:8px}
.card{padding:12px;border-radius:18px}
.prompt{font-size:30px;margin:24px 0 18px}
.prompt.deep{font-size:18px}
.actions{grid-template-columns:1fr;gap:9px}
.btn{font-size:15px;padding:12px 10px}
.known,.unknown{font-size:17px;padding:22px 8px}
.timerTop{font-size:12px}.timerTop b{font-size:16px}
.home h1{font-size:19px}
.levelbar{grid-template-columns:repeat(6,1fr);gap:4px}.level{font-size:11px;padding:7px 2px}
.dash{grid-template-columns:repeat(4,1fr);gap:5px;padding:9px}.big{font-size:18px}.lbl{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">🌏 Word World<small>v18 / Sleek Gate</small></div>
    <button class="iconBtn" id="settings">⚙️</button>
  </div>
  <section class="home">
    <h1 id="homeTitle">今日の学習</h1>
    <p id="homeText">Lv01から開始。反応速度を記録します。</p>
  </section>
  <div class="levelbar" id="levelbar"></div>

  <div class="grid">
    <section class="card">
      <div class="meta" id="meta"></div>
      <div class="prompt" id="prompt">Loading...</div>
      <div class="timer"><div class="timerTop"><span>認識時間</span><span><b id="remain">15.0</b> 秒</span></div><div class="barOut"><div class="bar" id="bar"></div></div></div>
    </section>
    <section class="card">
      <div class="actions" id="choices"></div>
      <div class="note" id="note">見た瞬間に反応。</div>
    </section>
  </div>

  <div class="dash">
    <div><div class="big" id="curLv">Lv01</div><div class="lbl">現在</div></div>
    <div><div class="big" id="rate">0%</div><div class="lbl">通過率</div></div>
    <div><div class="big" id="done">0</div><div class="lbl">試行</div></div>
    <div><div class="big" id="open">Lv01</div><div class="lbl">解放</div></div>
  </div>
</div>

<div class="modal" id="reasonModal"><div class="box"><h2 id="reasonTitle">理由</h2><p>2回目以降なので理由も記録します。</p><button class="reason" data-r="first_seen">初めて見る</button><button class="reason" data-r="forgotten">完全に忘れていた</button><button class="reason" data-r="misunderstood">勘違いしていた</button><button class="reason" data-r="no_memory">覚えた記憶がない</button><button class="reason" data-r="context_unknown">文脈だと分からない</button></div></div>
<div class="modal" id="settingsModal"><div class="box"><h2>設定</h2><div class="settingsList"><button id="viewLogs">学習履歴を見る</button><button id="exportJson">JSON出力</button><button id="closeSettings">閉じる</button></div><pre id="logsView" class="hide"></pre></div></div>
<div class="toast" id="toast">記録しました</div>
<div class="footer"><div class="nav"><button class="primary hide" id="next">次へ</button></div></div>

<script>
let DATA,items=[],logs=[],idxByLevel={},activeLevel=1,unlocked=1,timer=null,t0=0,limit=15,pending=null;
const E=x=>document.getElementById(x);
fetch('items.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;items=d.items;logs=JSON.parse(localStorage.ww18logs||'[]');unlocked=+localStorage.ww18unlocked||1;activeLevel=+localStorage.ww18active||1;idxByLevel=JSON.parse(localStorage.ww18idx||'{}');bind();render();});
function bind(){
 E('next').onclick=next;
 E('settings').onclick=()=>E('settingsModal').classList.add('show');
 E('closeSettings').onclick=()=>E('settingsModal').classList.remove('show');
 E('viewLogs').onclick=()=>{E('logsView').classList.toggle('hide');E('logsView').textContent=JSON.stringify(logs,null,2)};
 E('exportJson').onclick=()=>{let blob=new Blob([JSON.stringify(logs,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='wordworld_logs.json';a.click();URL.revokeObjectURL(url)};
 document.querySelectorAll('.reason').forEach(b=>b.onclick=()=>setReason(b.dataset.r,b.textContent));
}
function levelItems(l){return items.filter(x=>x.level===l)}
function levelLogs(l){return logs.filter(x=>x.level===l)}
function stats(l){let ls=levelLogs(l).filter(x=>'pass' in x), ok=ls.filter(x=>x.pass).length;return {n:ls.length,ok,rate:ls.length?Math.round(ok/ls.length*100):0}}
function evaluateUnlock(){for(let l=1;l<=6;l++){let g=DATA.config.gates[String(l)],s=stats(l);if(s.n>=g.minAttempts && s.rate>=g.unlockRate && unlocked<l+1){unlocked=Math.min(6,l+1)}}localStorage.ww18unlocked=unlocked}
function currentItem(){let arr=levelItems(activeLevel);let used=idxByLevel[activeLevel]||0;return arr[used%arr.length]}
function renderBar(){let h='';for(let l=1;l<=6;l++){let cls='level '+(l<=unlocked?'open ':'')+(l===activeLevel?'active':'');h+=`<div class="${cls}">Lv0${l}</div>`}E('levelbar').innerHTML=h}
function render(){evaluateUnlock();if(activeLevel>unlocked)activeLevel=unlocked;localStorage.ww18active=activeLevel;renderBar();let it=currentItem();E('meta').innerHTML=`<span class="pill">${it.id}</span><span class="pill">Lv0${it.level}</span>`;E('prompt').textContent=it.prompt;E('prompt').classList.toggle('deep',it.type!=='known');E('choices').classList.toggle('deep',it.type!=='known');E('note').textContent=it.type==='known'?'見た瞬間に反応。':'選択肢から選ぶ。分からない場合は「分からない」。';E('next').classList.toggle('hide',it.type==='known');E('homeText').textContent=it.type==='known'?'Lv01は軽快に自動送り。':'Lv02以降は理解チェック。';drawChoices(it);dash();start()}
function drawChoices(it){let box=E('choices');box.innerHTML='';if(it.type==='known'){[['known','知ってる'],['unknown','知らない']].forEach(([c,t])=>{let b=document.createElement('button');b.className='btn '+c;b.textContent=t;b.onclick=()=>answerKnown(c);box.appendChild(b)})}else{it.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=c;b.onclick=()=>answerChoice(i,b);box.appendChild(b)});let dk=document.createElement('button');dk.className='btn dontknow';dk.textContent='分からない';dk.onclick=()=>answerDontKnow();box.appendChild(dk)}}
function start(){if(timer)clearInterval(timer);t0=Date.now();limit=DATA.config.timeLimitSec||15;timer=setInterval(()=>{let s=(Date.now()-t0)/1000,r=Math.max(0,limit-s),p=Math.max(0,r/limit*100);E('remain').textContent=r.toFixed(1);E('bar').style.width=p+'%';E('bar').style.background=p>50?'#fb7c13':p>20?'#facc15':'#ef4444';if(r<=0)clearInterval(timer)},100)}
function sec(){let s=(Date.now()-t0)/1000;if(timer)clearInterval(timer);return +s.toFixed(2)}
function attemptNo(it){return logs.filter(x=>x.itemId===it.id).length+1}
function answerKnown(resp){let it=currentItem(),t=sec(),n=attemptNo(it);let rec={itemId:it.id,level:it.level,prompt:it.prompt,attemptNumber:n,response:resp,responseTimeSec:t,timestamp:new Date().toISOString()};if(resp==='unknown'){rec.unknownFlag=true;rec.unknownType=n===1?'baseline':'needs_reason';rec.pass=false}else{rec.pass=t<=limit}logs.push(rec);pending=logs.length-1;save();if(resp==='unknown'&&n>1){E('reasonTitle').textContent='知らない理由';E('reasonModal').classList.add('show');E('note').textContent='理由を選んでください。'}else{E('note').textContent=resp==='unknown'?'未学習として記録。ここから覚える。':(t<=limit?'記録しました。':'もう一歩。タイムリミット以内に瞬間的に反応する。');setTimeout(next,DATA.config.autoNextDelayMs||320)}dash();showToast()}
function answerDontKnow(){let it=currentItem(),t=sec(),n=attemptNo(it);let rec={itemId:it.id,level:it.level,prompt:it.prompt,attemptNumber:n,response:'dont_know',unknownFlag:true,unknownType:n===1?'baseline':'needs_reason',pass:false,responseTimeSec:t,timestamp:new Date().toISOString()};logs.push(rec);pending=logs.length-1;save();if(n>1){E('reasonTitle').textContent='分からない理由';E('reasonModal').classList.add('show');E('note').textContent='理由を選んでください。'}else{E('note').textContent='未理解として記録しました。'}dash()}
function answerChoice(i,b){let it=currentItem(),t=sec(),ok=i===it.answer,pass=ok&&t<=limit;[...E('choices').children].forEach((x,n)=>{x.disabled=true;if(n===it.answer)x.classList.add('correct')});if(!ok)b.classList.add('wrong');if(ok&&t>limit)b.classList.add('timeout');logs.push({itemId:it.id,level:it.level,prompt:it.prompt,attemptNumber:attemptNo(it),response:i,accuracy:ok,pass,responseTimeSec:t,timestamp:new Date().toISOString()});save();E('note').textContent=pass?'OK。次へ進みましょう。':(t>limit?'もう一歩。タイムリミット以内に瞬間的に反応する。':'もう一歩。');dash()}
function setReason(code,label){if(pending!=null){logs[pending].unknownType=code;logs[pending].unknownReasonLabel=label;save()}E('reasonModal').classList.remove('show');E('note').textContent='「'+label+'」として記録しました。';dash()}
function next(){idxByLevel[activeLevel]=(idxByLevel[activeLevel]||0)+1;evaluateUnlock();let s=stats(activeLevel),g=DATA.config.gates[String(activeLevel)];if(unlocked>activeLevel && s.n>=g.minAttempts && s.rate>=g.unlockRate){activeLevel++}render()}
function save(){localStorage.ww18logs=JSON.stringify(logs);localStorage.ww18unlocked=unlocked;localStorage.ww18active=activeLevel;localStorage.ww18idx=JSON.stringify(idxByLevel)}
function dash(){let s=stats(activeLevel);E('curLv').textContent='Lv0'+activeLevel;E('rate').textContent=s.rate+'%';E('done').textContent=s.n;E('open').textContent='Lv0'+unlocked}
function showToast(){let t=E('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),520)}
</script>
</body></html>
